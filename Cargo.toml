[package]
name = "oracle-random"
version = "0.1.0"
edition = "2021"
description = "Commit-reveal randomness beacon for Terra Classic"
license = "MIT"

exclude = ["contract.wasm", "hash.txt"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
library = []

[dependencies]
# NOTE: keep these in lockstep with oracle-score's Cargo.toml.
# Terra Classic must support the cosmwasm-std version you pick.
cosmwasm-schema = "1.5.0"
cosmwasm-std = { version = "1.5.0", features = ["iterator"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
